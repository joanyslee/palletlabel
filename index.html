<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Pallet Label Maker </title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background:
        linear-gradient(
            135deg,
            #fff0f6,
            #ffe4ef,
            #fff5f9
        );

    color: #5a3343;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;
}


/* =====================================================
   CONTROL PANEL
===================================================== */

.controls {

    width: 900px;

    max-width: 94%;

    margin: 35px auto;

    padding: 35px;

    background: rgba(255,255,255,0.92);

    border: 2px solid #ffc5d9;

    border-radius: 28px;

    box-shadow:
        0 10px 35px
        rgba(214, 87, 132, 0.15);
}


/* =====================================================
   TITLE
===================================================== */

h1 {

    text-align: center;

    margin: 0 0 8px 0;

    font-size: 38px;

    font-weight: 900;

    color: #d94f82;

    letter-spacing: -1px;
}


.instructions {

    text-align: center;

    color: #9c6478;

    font-size: 17px;

    margin-bottom: 28px;
}


/* =====================================================
   FILE AREA
===================================================== */

.file-area {

    text-align: center;

    padding: 30px;

    background: #fff7fa;

    border: 2px dashed #f3a9c3;

    border-radius: 22px;
}


/* =====================================================
   FILE INPUT
===================================================== */

input[type="file"] {

    font-size: 16px;

    margin: 15px;

    color: #7d4a5e;
}


/* =====================================================
   BUTTONS
===================================================== */

button {

    border: none;

    border-radius: 999px;

    padding:
        15px
        30px;

    margin: 6px;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

    color: white;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}


/* Generate Button */

button.generate-button {

    background:
        linear-gradient(
            135deg,
            #f58caf,
            #e96b96
        );

    box-shadow:
        0 5px 14px
        rgba(233,107,150,0.30);
}


/* Print Button */

button.print-button {

    background:
        linear-gradient(
            135deg,
            #d98ab0,
            #c66a97
        );

    box-shadow:
        0 5px 14px
        rgba(198,106,151,0.25);
}


/* Hover */

button:hover {

    transform:
        translateY(-2px)
        scale(1.02);
}


/* Click */

button:active {

    transform:
        translateY(1px)
        scale(0.98);
}


/* =====================================================
   STATUS
===================================================== */

#status {

    margin-top: 18px;

    text-align: center;

    color: #a25c76;

    font-size: 16px;

    font-weight: 600;
}


/* =====================================================
   PREVIEW
===================================================== */

#preview {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 30px;

    padding-bottom: 60px;
}


/* =====================================================
   LABEL
   LETTER LANDSCAPE
===================================================== */

.label {

    width: 11in;

    height: 8.5in;

    background: white;

    padding:
        0.12in
        0.18in;

    display: grid;

    grid-template-rows:
        1.55in
        1fr
        0.85in;

    overflow: hidden;

    page-break-after: always;

    break-after: page;

    box-shadow:
        0 6px 25px
        rgba(173,82,118,0.18);
}


/* =====================================================
   ITEM CODE / SAP CODE
===================================================== */

.item-code {

    width: 100%;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    font-size: 150px;

    font-weight: 900;

    line-height: 0.82;

    letter-spacing: -4px;

    white-space: nowrap;

    overflow: hidden;

    padding: 0;

    color: #111;
}


/* =====================================================
   PALLET AREA
===================================================== */

.pallet-area {

    width: 100%;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow: hidden;
}


/* =====================================================
   PALLET ID
   BIGGEST
===================================================== */

.pallet-number {

    font-size: 360px;

    font-weight: 900;

    line-height: 0.70;

    letter-spacing: -5px;

    max-width: 100%;

    white-space: nowrap;

    overflow: hidden;

    color: #111;
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom-info {

    width: 100%;

    height: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 68px;

    font-weight: 800;

    line-height: 1;

    color: #111;
}


/* =====================================================
   LOT NUMBER
===================================================== */

.lot-number {

    white-space: nowrap;
}


/* =====================================================
   QUANTITY
===================================================== */

.qty {

    white-space: nowrap;

    font-size: 72px;

    font-weight: 900;
}


/* =====================================================
   PRINT
===================================================== */

@media print {

    body {

        background: white;

        margin: 0;

        padding: 0;
    }


    .controls {

        display: none !important;
    }


    #preview {

        display: block;

        margin: 0;

        padding: 0;
    }


    .label {

        width: 11in;

        height: 8.5in;

        margin: 0;

        padding:
            0.12in
            0.18in;

        box-shadow: none;

        page-break-after: always;

        break-after: page;
    }


    .label:last-child {

        page-break-after: auto;

        break-after: auto;
    }
}


/* =====================================================
   LETTER LANDSCAPE
===================================================== */

@page {

    size: Letter landscape;

    margin: 0;
}

</style>

</head>


<body>


<!-- =====================================================
     CONTROL PANEL
===================================================== -->

<div class="controls">


    <h1>
         Pallet Label Maker 
    </h1>


    <div class="instructions">

        Upload your Packing List Excel file ✨

    </div>


    <div class="file-area">


        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >


        <br>


        <button
            class="generate-button"
            onclick="generateLabels()"
        >
            🌸 Generate Labels
        </button>


        <button
            class="print-button"
            onclick="printLabels()"
        >
            🖨️ Print / Save PDF
        </button>


        <div id="status"></div>

    </div>

</div>


<!-- =====================================================
     LABEL PREVIEW
===================================================== -->

<div id="preview"></div>


<script>


/* =====================================================
   NORMALIZE HEADER
===================================================== */

function normalizeHeader(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[_\-]/g, " ")
        .replace(/\s+/g, " ");

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(
    headers,
    possibleNames
) {

    for (
        const header of headers
    ) {

        const normalizedHeader =
            normalizeHeader(header);


        for (
            const name of possibleNames
        ) {

            if (
                normalizedHeader ===
                normalizeHeader(name)
            ) {

                return header;

            }

        }

    }

    return null;
}


/* =====================================================
   AUTO-SIZE ITEM CODE
===================================================== */

function fitItemCode(element) {

    const container =
        element.parentElement;


    const maxWidth =
        container.clientWidth;


    const maxHeight =
        container.clientHeight;


    /*
       Start at 150px.
       This is slightly smaller
       than the previous version.
    */

    let fontSize = 150;


    element.style.fontSize =
        fontSize + "px";


    /*
       Reduce only if the
       text doesn't fit.
    */

    while (

        (
            element.scrollWidth >
            maxWidth ||

            element.scrollHeight >
            maxHeight
        )

        &&

        fontSize > 35

    ) {

        fontSize -= 2;


        element.style.fontSize =
            fontSize + "px";
    }

}


/* =====================================================
   AUTO-SIZE PALLET ID
===================================================== */

function fitPalletNumber(element) {

    const container =
        element.parentElement;


    const maxWidth =
        container.clientWidth;


    const maxHeight =
        container.clientHeight;


    /*
       Pallet ID stays the biggest.
    */

    let fontSize = 390;


    element.style.fontSize =
        fontSize + "px";


    while (

        (
            element.scrollWidth >
            maxWidth ||

            element.scrollHeight >
            maxHeight
        )

        &&

        fontSize > 80

    ) {

        fontSize -= 2;


        element.style.fontSize =
            fontSize + "px";
    }

}


/* =====================================================
   GENERATE LABELS
===================================================== */

async function generateLabels() {

    const fileInput =
        document.getElementById(
            "excelFile"
        );


    const status =
        document.getElementById(
            "status"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    /* =============================================
       CHECK FILE
    ============================================= */

    if (
        !fileInput.files.length
    ) {

        alert(
            "Please select your Packing List Excel file."
        );

        return;
    }


    const file =
        fileInput.files[0];


    status.textContent =
        "Reading Excel file... 💕";


    preview.innerHTML = "";


    try {


        /* =============================================
           READ EXCEL
        ============================================= */

        const arrayBuffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array",

                    cellStyles: true
                }
            );


        /* =============================================
           FIRST SHEET
        ============================================= */

        const sheetName =
            workbook.SheetNames[0];


        const worksheet =
            workbook.Sheets[
                sheetName
            ];


        if (!worksheet) {

            throw new Error(
                "No worksheet found."
            );
        }


        /* =============================================
           READ DATA
        ============================================= */

        const rawData =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,

                    defval: ""
                }
            );


        if (
            !rawData ||
            rawData.length === 0
        ) {

            throw new Error(
                "The Excel sheet is empty."
            );
        }


        /* =============================================
           FIND HEADER ROW
        ============================================= */

        let headerRowIndex = -1;


        for (
            let i = 0;

            i <
            Math.min(
                rawData.length,
                20
            );

            i++
        ) {

            const row =
                rawData[i].map(
                    normalizeHeader
                );


            /* SAP */

            const hasSAP =
                row.some(x =>
                    [
                        "sap",
                        "sap code",
                        "sapcode",
                        "sap item",
                        "sap item code"
                    ].includes(x)
                );


            /* PALLET ID */

            const hasPallet =
                row.some(x =>
                    [
                        "pallet id",
                        "palletid",
                        "pallet",
                        "pallet number",
                        "pallet no",
                        "pallet no."
                    ].includes(x)
                );


            /* QTY */

            const hasQty =
                row.some(x =>
                    [
                        "qty",
                        "quantity",
                        "qty."
                    ].includes(x)
                );


            if (
                hasSAP &&
                hasPallet &&
                hasQty
            ) {

                headerRowIndex =
                    i;

                break;
            }

        }


        /* =============================================
           HEADER NOT FOUND
        ============================================= */

        if (
            headerRowIndex === -1
        ) {

            throw new Error(
                "Could not find SAP / SAP Code, Pallet ID and Qty columns."
            );
        }


        /* =============================================
           HEADERS
        ============================================= */

        const headers =
            rawData[
                headerRowIndex
            ];


        /* =============================================
           DATA ROWS
        ============================================= */

        const dataRows =
            rawData.slice(
                headerRowIndex + 1
            );


        /* =============================================
           CREATE OBJECTS
        ============================================= */

        const rows =
            dataRows

                .filter(row =>
                    row.some(cell =>
                        String(
                            cell
                        ).trim() !== ""
                    )
                )

                .map(row => {

                    const obj = {};


                    headers.forEach(
                        (
                            header,
                            index
                        ) => {

                            obj[header] =
                                row[index] ??
                                "";
                        }
                    );


                    return obj;

                });


        /* =============================================
           FIND COLUMNS
        ============================================= */

        const sapColumn =
            findColumn(
                headers,

                [
                    "SAP",
                    "SAP Code",
                    "SAPCode",
                    "SAP Item",
                    "SAP Item Code"
                ]
            );


        const palletColumn =
            findColumn(
                headers,

                [
                    "Pallet ID",
                    "PalletID",
                    "Pallet",
                    "Pallet Number",
                    "Pallet No",
                    "Pallet No."
                ]
            );


        const qtyColumn =
            findColumn(
                headers,

                [
                    "Qty",
                    "Quantity",
                    "QTY."
                ]
            );


        /* =============================================
           VALIDATE
        ============================================= */

        if (!sapColumn) {

            throw new Error(
                "SAP / SAP Code column not found."
            );
        }


        if (!palletColumn) {

            throw new Error(
                "Pallet ID column not found."
            );
        }


        if (!qtyColumn) {

            throw new Error(
                "Qty / Quantity column not found."
            );
        }


        /* =============================================
           CREATE LABELS
        ============================================= */

        let generated = 0;


        rows.forEach(row => {


            /* =========================================
               VALUES
            ========================================= */

            const sapCode =
                String(
                    row[sapColumn] ??
                    ""
                ).trim();


            const palletID =
                String(
                    row[palletColumn] ??
                    ""
                ).trim();


            const qty =
                String(
                    row[qtyColumn] ??
                    ""
                ).trim();


            /* =========================================
               SKIP EMPTY ROW
            ========================================= */

            if (
                !sapCode &&
                !palletID &&
                !qty
            ) {

                return;
            }


            /* =========================================
               LABEL
            ========================================= */

            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "label";


            /* =========================================
               ITEM CODE
            ========================================= */

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item-code";


            item.textContent =
                sapCode;


            /* =========================================
               PALLET ID
               ADD #
            ========================================= */

            const palletArea =
                document.createElement(
                    "div"
                );


            palletArea.className =
                "pallet-area";


            const pallet =
                document.createElement(
                    "div"
                );


            pallet.className =
                "pallet-number";


            pallet.textContent =
                "#" + palletID;


            palletArea.appendChild(
                pallet
            );


            /* =========================================
               BOTTOM
            ========================================= */

            const bottom =
                document.createElement(
                    "div"
                );


            bottom.className =
                "bottom-info";


            /* LOT NUMBER */

            const lot =
                document.createElement(
                    "div"
                );


            lot.className =
                "lot-number";


            lot.textContent =
                "Lot Number:";


            /* QTY */

            const quantity =
                document.createElement(
                    "div"
                );


            quantity.className =
                "qty";


            quantity.textContent =
                "Qty: " + qty;


            /* =========================================
               ASSEMBLE
            ========================================= */

            bottom.appendChild(
                lot
            );


            bottom.appendChild(
                quantity
            );


            label.appendChild(
                item
            );


            label.appendChild(
                palletArea
            );


            label.appendChild(
                bottom
            );


            preview.appendChild(
                label
            );


            generated++;

        });


        /* =============================================
           CHECK RESULT
        ============================================= */

        if (
            generated === 0
        ) {

            throw new Error(
                "No pallet data was found."
            );
        }


        /* =============================================
           FIT TEXT
        ============================================= */

        requestAnimationFrame(() => {


            document
                .querySelectorAll(
                    ".item-code"
                )
                .forEach(
                    element => {

                        fitItemCode(
                            element
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".pallet-number"
                )
                .forEach(
                    element => {

                        fitPalletNumber(
                            element
                        );

                    }
                );

        });


        /* =============================================
           STATUS
        ============================================= */

        status.textContent =
            generated +
            " pallet label(s) generated successfully! 🎀";


        /* =============================================
           SCROLL TO LABELS
        ============================================= */

        preview.scrollIntoView({
            behavior: "smooth"
        });


    }


    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "";


        alert(
            "Error:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   PRINT
===================================================== */

function printLabels() {

    const preview =
        document.getElementById(
            "preview"
        );


    if (
        !preview.children.length
    ) {

        alert(
            "Please generate labels first."
        );

        return;
    }


    window.print();

}

</script>

</body>

</html>
