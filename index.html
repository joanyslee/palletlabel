<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pallet ID Generator</title>


<!-- =====================================================
     SHEETJS
     Used to read Excel files
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #eeeeee;

    color: #111111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   CONTROL PANEL
===================================================== */

.controls {

    width: 900px;

    max-width: 95%;

    margin: 30px auto;

    padding: 30px;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.15);
}


h1 {

    text-align: center;

    margin-top: 0;

    margin-bottom: 10px;

    font-size: 34px;
}


.instructions {

    text-align: center;

    color: #555555;

    font-size: 17px;

    margin-bottom: 25px;
}


.file-area {

    text-align: center;

    padding: 25px;

    border: 2px dashed #aaaaaa;

    border-radius: 10px;
}


input[type="file"] {

    font-size: 16px;

    margin: 15px;
}


button {

    border: none;

    border-radius: 8px;

    padding: 14px 28px;

    margin: 5px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    background: #2563eb;

    color: white;
}


button:hover {

    background: #1d4ed8;
}


button.print-button {

    background: #111827;
}


button.print-button:hover {

    background: #000000;
}


#status {

    margin-top: 15px;

    text-align: center;

    color: #555555;

    font-size: 16px;
}


/* =====================================================
   PREVIEW AREA
===================================================== */

#preview {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 30px;

    padding-bottom: 50px;
}


/* =====================================================
   LETTER LANDSCAPE

   11 x 8.5 inch
===================================================== */

.label {

    width: 11in;

    height: 8.5in;

    background: white;

    padding:
        0.30in
        0.45in;

    display: flex;

    flex-direction: column;

    position: relative;

    page-break-after: always;

    break-after: page;

    box-shadow:
        0 3px 18px rgba(0,0,0,0.20);
}


/* =====================================================
   ITEM CODE

   LARGE
===================================================== */

.item-code {

    width: 100%;

    text-align: center;

    font-size: 85px;

    font-weight: 900;

    line-height: 1;

    margin-top: 0.02in;

    word-break: break-word;
}


/* =====================================================
   PALLET NUMBER AREA
===================================================== */

.pallet-area {

    flex: 1;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow: hidden;

    padding:
        0.05in
        0;
}


/* =====================================================
   PALLET NUMBER

   THE BIGGEST TEXT
===================================================== */

.pallet-number {

    font-size: 280px;

    font-weight: 900;

    line-height: 0.82;

    letter-spacing: 2px;

    max-width: 100%;

    word-break: break-word;
}


/* =====================================================
   BOTTOM INFORMATION
===================================================== */

.bottom-info {

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    font-size: 52px;

    font-weight: 700;

    margin-bottom: 0.02in;
}


/* =====================================================
   LOT NUMBER
===================================================== */

.lot-number {

    display: flex;

    align-items: flex-end;

    white-space: nowrap;
}


.lot-line {

    display: inline-block;

    width: 4in;

    height: 55px;

    margin-left: 12px;

    border-bottom:
        4px solid #111111;
}


/* =====================================================
   QTY
===================================================== */

.qty {

    font-size: 56px;

    font-weight: 900;

    white-space: nowrap;
}


/* =====================================================
   PRINT SETTINGS
===================================================== */

@media print {

    body {

        background: white;

        margin: 0;

        padding: 0;
    }


    .controls {

        display: none !important;
    }


    #preview {

        display: block;

        margin: 0;

        padding: 0;
    }


    .label {

        width: 11in;

        height: 8.5in;

        margin: 0;

        padding:
            0.30in
            0.45in;

        box-shadow: none;

        page-break-after: always;

        break-after: page;
    }


    .label:last-child {

        page-break-after: auto;

        break-after: auto;
    }
}


/* =====================================================
   LETTER LANDSCAPE
===================================================== */

@page {

    size: Letter landscape;

    margin: 0;
}

</style>

</head>


<body>


<!-- =====================================================
     CONTROL PANEL
===================================================== -->

<div class="controls">


    <h1>
        Pallet ID Generator
    </h1>


    <div class="instructions">

        Upload your Packing List Excel file

    </div>


    <div class="file-area">


        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >


        <br>


        <button
            onclick="generateLabels()"
        >
            Generate Labels
        </button>


        <button
            class="print-button"
            onclick="printLabels()"
        >
            Print / Save PDF
        </button>


        <div id="status"></div>


    </div>

</div>



<!-- =====================================================
     LABEL PREVIEW
===================================================== -->

<div id="preview"></div>



<script>


/* =====================================================
   NORMALIZE HEADER
===================================================== */

function normalizeHeader(value) {

    return String(value || "")

        .trim()

        .toLowerCase()

        .replace(/[_\-]/g, " ")

        .replace(/\s+/g, " ");

}



/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(headers, possibleNames) {


    for (const header of headers) {


        const normalizedHeader =
            normalizeHeader(header);


        for (const name of possibleNames) {


            if (
                normalizedHeader ===
                normalizeHeader(name)
            ) {

                return header;

            }

        }

    }


    return null;

}



/* =====================================================
   PALLET NUMBER FONT SIZE

   Automatically reduces size for long numbers.
===================================================== */

function adjustPalletFontSize(
    element,
    value
) {


    const text =
        String(value);


    const length =
        text.length;


    if (length <= 3) {

        element.style.fontSize =
            "280px";

    }

    else if (length === 4) {

        element.style.fontSize =
            "260px";

    }

    else if (length === 5) {

        element.style.fontSize =
            "235px";

    }

    else if (length === 6) {

        element.style.fontSize =
            "210px";

    }

    else if (length === 7) {

        element.style.fontSize =
            "185px";

    }

    else if (length === 8) {

        element.style.fontSize =
            "165px";

    }

    else if (length === 9) {

        element.style.fontSize =
            "145px";

    }

    else {

        element.style.fontSize =
            "125px";

    }

}



/* =====================================================
   GENERATE LABELS
===================================================== */

async function generateLabels() {


    const fileInput =
        document.getElementById(
            "excelFile"
        );


    const status =
        document.getElementById(
            "status"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    /* =================================================
       CHECK FILE
    ================================================= */

    if (
        !fileInput.files.length
    ) {

        alert(
            "Please select your Packing List Excel file."
        );

        return;

    }


    const file =
        fileInput.files[0];


    status.textContent =
        "Reading Excel file...";


    preview.innerHTML =
        "";


    try {


        /* =================================================
           READ EXCEL
        ================================================= */

        const arrayBuffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array",

                    cellStyles: true
                }
            );


        /* =================================================
           FIRST SHEET
        ================================================= */

        const sheetName =
            workbook.SheetNames[0];


        const worksheet =
            workbook.Sheets[
                sheetName
            ];


        if (!worksheet) {

            throw new Error(
                "No worksheet found."
            );

        }


        /* =================================================
           READ AS ARRAY
        ================================================= */

        const rawData =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,

                    defval: ""
                }
            );


        if (
            !rawData ||
            rawData.length === 0
        ) {

            throw new Error(
                "The Excel sheet is empty."
            );

        }


        /* =================================================
           FIND HEADER ROW

           Search first 20 rows.
        ================================================= */

        let headerRowIndex =
            -1;


        for (
            let i = 0;

            i <
            Math.min(
                rawData.length,
                20
            );

            i++
        ) {


            const row =
                rawData[i].map(
                    normalizeHeader
                );


            const hasItem =
                row.some(x =>
                    [
                        "item code",
                        "itemcode",
                        "item",
                        "sku",
                        "product code"
                    ].includes(x)
                );


            const hasPallet =
                row.some(x =>
                    [
                        "pallet number",
                        "palletnumber",
                        "pallet",
                        "pallet no",
                        "pallet no.",
                        "pallet #",
                        "pallet id"
                    ].includes(x)
                );


            const hasQty =
                row.some(x =>
                    [
                        "qty",
                        "quantity",
                        "qty."
                    ].includes(x)
                );


            if (
                hasItem &&
                hasPallet &&
                hasQty
            ) {

                headerRowIndex =
                    i;

                break;

            }

        }


        /* =================================================
           HEADER NOT FOUND
        ================================================= */

        if (
            headerRowIndex === -1
        ) {

            throw new Error(
                "Could not find Item Code, Pallet Number and Qty columns."
            );

        }


        /* =================================================
           GET HEADERS
        ================================================= */

        const headers =
            rawData[
                headerRowIndex
            ];


        /* =================================================
           GET DATA ROWS
        ================================================= */

        const dataRows =
            rawData.slice(
                headerRowIndex + 1
            );


        /* =================================================
           CREATE ROW OBJECTS
        ================================================= */

        const rows =
            dataRows

                .filter(row =>

                    row.some(cell =>
                        String(
                            cell
                        ).trim() !== ""
                    )

                )

                .map(row => {


                    const obj = {};


                    headers.forEach(
                        (
                            header,
                            index
                        ) => {

                            obj[header] =
                                row[index] ??
                                "";

                        }
                    );


                    return obj;

                });


        /* =================================================
           FIND COLUMNS
        ================================================= */

        const itemColumn =
            findColumn(
                headers,

                [
                    "Item Code",
                    "ItemCode",
                    "Item",
                    "SKU",
                    "Product Code"
                ]
            );


        const palletColumn =
            findColumn(
                headers,

                [
                    "Pallet Number",
                    "PalletNumber",
                    "Pallet",
                    "Pallet No",
                    "Pallet No.",
                    "Pallet #",
                    "Pallet ID"
                ]
            );


        const qtyColumn =
            findColumn(
                headers,

                [
                    "Qty",
                    "Quantity",
                    "QTY."
                ]
            );


        /* =================================================
           VALIDATE
        ================================================= */

        if (!itemColumn) {

            throw new Error(
                "Item Code column not found."
            );

        }


        if (!palletColumn) {

            throw new Error(
                "Pallet Number column not found."
            );

        }


        if (!qtyColumn) {

            throw new Error(
                "Qty / Quantity column not found."
            );

        }


        /* =================================================
           CREATE LABELS
        ================================================= */

        let generated = 0;


        rows.forEach(row => {


            const itemCode =
                String(
                    row[itemColumn] ??
                    ""
                ).trim();


            const palletNumber =
                String(
                    row[palletColumn] ??
                    ""
                ).trim();


            const qty =
                String(
                    row[qtyColumn] ??
                    ""
                ).trim();


            /* =============================================
               SKIP EMPTY ROW
            ============================================= */

            if (
                !itemCode &&
                !palletNumber &&
                !qty
            ) {

                return;

            }


            /* =============================================
               LABEL
            ============================================= */

            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "label";


            /* =============================================
               ITEM CODE
            ============================================= */

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item-code";


            item.textContent =
                itemCode;


            /* =============================================
               PALLET AREA
            ============================================= */

            const palletArea =
                document.createElement(
                    "div"
                );


            palletArea.className =
                "pallet-area";


            /* =============================================
               PALLET NUMBER
            ============================================= */

            const pallet =
                document.createElement(
                    "div"
                );


            pallet.className =
                "pallet-number";


            pallet.textContent =
                palletNumber;


            adjustPalletFontSize(
                pallet,
                palletNumber
            );


            palletArea.appendChild(
                pallet
            );


            /* =============================================
               BOTTOM INFO
            ============================================= */

            const bottom =
                document.createElement(
                    "div"
                );


            bottom.className =
                "bottom-info";


            /* =============================================
               LOT NUMBER
            ============================================= */

            const lot =
                document.createElement(
                    "div"
                );


            lot.className =
                "lot-number";


            lot.innerHTML = `

                <span>
                    Lot Number:
                </span>

                <span
                    class="lot-line"
                ></span>

            `;


            /* =============================================
               QTY
            ============================================= */

            const quantity =
                document.createElement(
                    "div"
                );


            quantity.className =
                "qty";


            quantity.textContent =
                "Qty: " +
                qty;


            /* =============================================
               ASSEMBLE LABEL
            ============================================= */

            bottom.appendChild(
                lot
            );


            bottom.appendChild(
                quantity
            );


            label.appendChild(
                item
            );


            label.appendChild(
                palletArea
            );


            label.appendChild(
                bottom
            );


            preview.appendChild(
                label
            );


            generated++;


        });


        /* =================================================
           CHECK RESULT
        ================================================= */

        if (
            generated === 0
        ) {

            throw new Error(
                "No pallet data was found."
            );

        }


        /* =================================================
           STATUS
        ================================================= */

        status.textContent =
            generated +
            " pallet label(s) generated successfully.";


        /* =================================================
           SCROLL TO PREVIEW
        ================================================= */

        preview.scrollIntoView({
            behavior: "smooth"
        });


    }


    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "";


        alert(
            "Error:\n\n" +
            error.message
        );

    }

}



/* =====================================================
   PRINT
===================================================== */

function printLabels() {


    const preview =
        document.getElementById(
            "preview"
        );


    if (
        !preview.children.length
    ) {

        alert(
            "Please generate labels first."
        );

        return;

    }


    window.print();

}

</script>


</body>

</html>
