<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pallet ID Generator</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eeeeee;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   CONTROL PANEL
===================================================== */

.controls {
    width: 900px;
    max-width: 95%;
    margin: 30px auto;
    padding: 30px;

    background: white;

    border-radius: 12px;

    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin: 0 0 10px 0;
    font-size: 34px;
}

.instructions {
    text-align: center;
    color: #555;
    font-size: 17px;
    margin-bottom: 25px;
}

.file-area {
    text-align: center;
    padding: 25px;
    border: 2px dashed #aaa;
    border-radius: 10px;
}

input[type="file"] {
    font-size: 16px;
    margin: 15px;
}

button {
    border: none;
    border-radius: 8px;

    padding: 14px 28px;

    margin: 5px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

button.print-button {
    background: #111827;
}

button.print-button:hover {
    background: #000;
}

#status {
    margin-top: 15px;
    text-align: center;
    color: #555;
    font-size: 16px;
}


/* =====================================================
   PREVIEW
===================================================== */

#preview {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 30px;

    padding-bottom: 50px;
}


/* =====================================================
   LETTER LANDSCAPE

   11 x 8.5 inch
===================================================== */

.label {

    width: 11in;

    height: 8.5in;

    background: white;

    padding: 0.25in 0.40in;

    display: flex;

    flex-direction: column;

    position: relative;

    page-break-after: always;

    break-after: page;

    box-shadow: 0 3px 18px rgba(0,0,0,0.20);
}


/* =====================================================
   ITEM CODE

   VERY LARGE
===================================================== */

.item-code {

    width: 100%;

    text-align: center;

    font-size: 105px;

    font-weight: 900;

    line-height: 0.95;

    margin-top: 0;

    word-break: break-word;

    overflow-wrap: anywhere;
}


/* =====================================================
   PALLET AREA
===================================================== */

.pallet-area {

    flex: 1;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow: hidden;
}


/* =====================================================
   PALLET NUMBER

   ABSOLUTELY THE BIGGEST
===================================================== */

.pallet-number {

    font-size: 300px;

    font-weight: 900;

    line-height: 0.80;

    letter-spacing: 1px;

    max-width: 100%;

    word-break: break-word;

    overflow-wrap: anywhere;
}


/* =====================================================
   BOTTOM INFORMATION
===================================================== */

.bottom-info {

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 60px;

    font-weight: 800;

    margin-bottom: 0;
}


/* =====================================================
   LOT NUMBER

   NO LINE
===================================================== */

.lot-number {

    display: flex;

    align-items: center;

    white-space: nowrap;
}


/* =====================================================
   QTY
===================================================== */

.qty {

    font-size: 64px;

    font-weight: 900;

    white-space: nowrap;
}


/* =====================================================
   PRINT
===================================================== */

@media print {

    body {
        background: white;
        margin: 0;
        padding: 0;
    }

    .controls {
        display: none !important;
    }

    #preview {
        display: block;
        margin: 0;
        padding: 0;
    }

    .label {

        width: 11in;

        height: 8.5in;

        margin: 0;

        padding: 0.25in 0.40in;

        box-shadow: none;

        page-break-after: always;

        break-after: page;
    }

    .label:last-child {

        page-break-after: auto;

        break-after: auto;
    }
}


/* =====================================================
   LETTER LANDSCAPE
===================================================== */

@page {

    size: Letter landscape;

    margin: 0;
}

</style>

</head>


<body>


<!-- =====================================================
     CONTROL PANEL
===================================================== -->

<div class="controls">

    <h1>
        Pallet ID Generator
    </h1>

    <div class="instructions">
        Upload your Packing List Excel file
    </div>

    <div class="file-area">

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >

        <br>

        <button onclick="generateLabels()">
            Generate Labels
        </button>

        <button
            class="print-button"
            onclick="printLabels()"
        >
            Print / Save PDF
        </button>

        <div id="status"></div>

    </div>

</div>



<!-- =====================================================
     LABEL PREVIEW
===================================================== -->

<div id="preview"></div>



<script>


/* =====================================================
   NORMALIZE HEADER
===================================================== */

function normalizeHeader(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[_\-]/g, " ")
        .replace(/\s+/g, " ");

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(headers, possibleNames) {

    for (const header of headers) {

        const normalizedHeader =
            normalizeHeader(header);

        for (const name of possibleNames) {

            if (
                normalizedHeader ===
                normalizeHeader(name)
            ) {

                return header;

            }

        }

    }

    return null;

}


/* =====================================================
   PALLET NUMBER FONT SIZE

   Short numbers = HUGE
   Long numbers = automatically smaller
===================================================== */

function adjustPalletFontSize(element, value) {

    const length =
        String(value).length;


    if (length <= 3) {

        element.style.fontSize = "300px";

    }

    else if (length === 4) {

        element.style.fontSize = "285px";

    }

    else if (length === 5) {

        element.style.fontSize = "265px";

    }

    else if (length === 6) {

        element.style.fontSize = "240px";

    }

    else if (length === 7) {

        element.style.fontSize = "215px";

    }

    else if (length === 8) {

        element.style.fontSize = "190px";

    }

    else if (length === 9) {

        element.style.fontSize = "165px";

    }

    else {

        element.style.fontSize = "140px";

    }

}


/* =====================================================
   GENERATE LABELS
===================================================== */

async function generateLabels() {

    const fileInput =
        document.getElementById("excelFile");

    const status =
        document.getElementById("status");

    const preview =
        document.getElementById("preview");


    if (!fileInput.files.length) {

        alert(
            "Please select your Packing List Excel file."
        );

        return;

    }


    const file =
        fileInput.files[0];


    status.textContent =
        "Reading Excel file...";


    preview.innerHTML = "";


    try {


        /* =============================================
           READ EXCEL
        ============================================= */

        const arrayBuffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array",
                    cellStyles: true
                }
            );


        /* =============================================
           FIRST SHEET
        ============================================= */

        const sheetName =
            workbook.SheetNames[0];


        const worksheet =
            workbook.Sheets[sheetName];


        if (!worksheet) {

            throw new Error(
                "No worksheet found."
            );

        }


        /* =============================================
           READ SHEET
        ============================================= */

        const rawData =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: ""
                }
            );


        if (
            !rawData ||
            rawData.length === 0
        ) {

            throw new Error(
                "The Excel sheet is empty."
            );

        }


        /* =============================================
           FIND HEADER ROW
        ============================================= */

        let headerRowIndex = -1;


        for (
            let i = 0;
            i < Math.min(rawData.length, 20);
            i++
        ) {

            const row =
                rawData[i].map(
                    normalizeHeader
                );


            const hasItem =
                row.some(x =>
                    [
                        "item code",
                        "itemcode",
                        "item",
                        "sku",
                        "product code"
                    ].includes(x)
                );


            const hasPallet =
                row.some(x =>
                    [
                        "pallet number",
                        "palletnumber",
                        "pallet",
                        "pallet no",
                        "pallet no.",
                        "pallet #",
                        "pallet id"
                    ].includes(x)
                );


            const hasQty =
                row.some(x =>
                    [
                        "qty",
                        "quantity",
                        "qty."
                    ].includes(x)
                );


            if (
                hasItem &&
                hasPallet &&
                hasQty
            ) {

                headerRowIndex = i;

                break;

            }

        }


        if (headerRowIndex === -1) {

            throw new Error(
                "Could not find Item Code, Pallet Number and Qty columns."
            );

        }


        /* =============================================
           HEADERS
        ============================================= */

        const headers =
            rawData[headerRowIndex];


        /* =============================================
           DATA ROWS
        ============================================= */

        const dataRows =
            rawData.slice(
                headerRowIndex + 1
            );


        const rows =
            dataRows

                .filter(row =>
                    row.some(cell =>
                        String(cell).trim() !== ""
                    )
                )

                .map(row => {

                    const obj = {};

                    headers.forEach(
                        (header, index) => {

                            obj[header] =
                                row[index] ?? "";

                        }
                    );

                    return obj;

                });


        /* =============================================
           FIND COLUMNS
        ============================================= */

        const itemColumn =
            findColumn(
                headers,
                [
                    "Item Code",
                    "ItemCode",
                    "Item",
                    "SKU",
                    "Product Code"
                ]
            );


        const palletColumn =
            findColumn(
                headers,
                [
                    "Pallet Number",
                    "PalletNumber",
                    "Pallet",
                    "Pallet No",
                    "Pallet No.",
                    "Pallet #",
                    "Pallet ID"
                ]
            );


        const qtyColumn =
            findColumn(
                headers,
                [
                    "Qty",
                    "Quantity",
                    "QTY."
                ]
            );


        if (!itemColumn) {

            throw new Error(
                "Item Code column not found."
            );

        }


        if (!palletColumn) {

            throw new Error(
                "Pallet Number column not found."
            );

        }


        if (!qtyColumn) {

            throw new Error(
                "Qty / Quantity column not found."
            );

        }


        /* =============================================
           GENERATE EACH LABEL
        ============================================= */

        let generated = 0;


        rows.forEach(row => {


            const itemCode =
                String(
                    row[itemColumn] ?? ""
                ).trim();


            const palletNumber =
                String(
                    row[palletColumn] ?? ""
                ).trim();


            const qty =
                String(
                    row[qtyColumn] ?? ""
                ).trim();


            /* =========================================
               SKIP EMPTY ROW
            ========================================= */

            if (
                !itemCode &&
                !palletNumber &&
                !qty
            ) {

                return;

            }


            /* =========================================
               LABEL
            ========================================= */

            const label =
                document.createElement("div");


            label.className =
                "label";


            /* =========================================
               ITEM CODE
            ========================================= */

            const item =
                document.createElement("div");


            item.className =
                "item-code";


            item.textContent =
                itemCode;


            /* =========================================
               PALLET NUMBER
            ========================================= */

            const palletArea =
                document.createElement("div");


            palletArea.className =
                "pallet-area";


            const pallet =
                document.createElement("div");


            pallet.className =
                "pallet-number";


            pallet.textContent =
                palletNumber;


            adjustPalletFontSize(
                pallet,
                palletNumber
            );


            palletArea.appendChild(
                pallet
            );


            /* =========================================
               BOTTOM
            ========================================= */

            const bottom =
                document.createElement("div");


            bottom.className =
                "bottom-info";


            /* =========================================
               LOT NUMBER
            ========================================= */

            const lot =
                document.createElement("div");


            lot.className =
                "lot-number";


            lot.textContent =
                "Lot Number:";


            /* =========================================
               QTY
            ========================================= */

            const quantity =
                document.createElement("div");


            quantity.className =
                "qty";


            quantity.textContent =
                "Qty: " + qty;


            /* =========================================
               ASSEMBLE
            ========================================= */

            bottom.appendChild(
                lot
            );


            bottom.appendChild(
                quantity
            );


            label.appendChild(
                item
            );


            label.appendChild(
                palletArea
            );


            label.appendChild(
                bottom
            );


            preview.appendChild(
                label
            );


            generated++;

        });


        /* =============================================
           CHECK
        ============================================= */

        if (generated === 0) {

            throw new Error(
                "No pallet data was found."
            );

        }


        status.textContent =
            generated +
            " pallet label(s) generated successfully.";


        /* =============================================
           SCROLL
        ============================================= */

        preview.scrollIntoView({
            behavior: "smooth"
        });


    }


    catch (error) {

        console.error(error);

        status.textContent = "";

        alert(
            "Error:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   PRINT
===================================================== */

function printLabels() {

    const preview =
        document.getElementById("preview");


    if (
        !preview.children.length
    ) {

        alert(
            "Please generate labels first."
        );

        return;

    }


    window.print();

}

</script>


</body>

</html>
