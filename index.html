<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pallet ID Generator</title>

<!-- SheetJS: Excel (.xlsx) reader -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
}

/* =========================
   CONTROL PANEL
========================= */

.controls {
    width: 900px;
    max-width: 95%;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
}

h1 {
    margin-top: 0;
    text-align: center;
}

.instructions {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}

.file-area {
    text-align: center;
    padding: 20px;
    border: 2px dashed #aaa;
    border-radius: 10px;
}

input[type="file"] {
    margin: 15px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 25px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

button.print-button {
    background: #111827;
}

button.print-button:hover {
    background: #000;
}

#status {
    margin-top: 15px;
    text-align: center;
    color: #555;
}

/* =========================
   LABEL AREA
========================= */

#preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
    padding-bottom: 50px;
}

/*
    Letter Landscape

    11in x 8.5in
*/

.label {
    width: 11in;
    height: 8.5in;

    background: white;

    padding: 0.45in 0.55in;

    display: flex;
    flex-direction: column;

    position: relative;

    page-break-after: always;

    box-shadow: 0 2px 15px rgba(0,0,0,.2);
}

/* =========================
   ITEM CODE
========================= */

.item-code {
    text-align: center;

    font-size: 48px;
    font-weight: bold;

    margin-top: 0.15in;

    word-break: break-word;
}

/* =========================
   PALLET NUMBER
========================= */

.pallet-area {
    flex: 1;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.pallet-number {
    font-size: 150px;
    font-weight: 900;

    line-height: 1;

    word-break: break-word;

    max-width: 100%;
}

/* =========================
   BOTTOM INFO
========================= */

.bottom-info {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: flex-end;

    font-size: 32px;

    margin-bottom: 0.15in;
}

.lot-number {
    display: flex;
    align-items: flex-end;
}

.lot-line {
    display: inline-block;

    width: 3.5in;

    border-bottom: 2px solid #111;

    margin-left: 10px;

    height: 35px;
}

.qty {
    font-weight: bold;
}


/* =========================
   PRINT
========================= */

@media print {

    body {
        background: white;
        margin: 0;
    }

    .controls {
        display: none !important;
    }

    #preview {
        display: block;
        padding: 0;
        margin: 0;
    }

    .label {
        width: 11in;
        height: 8.5in;

        margin: 0;
        padding: 0.45in 0.55in;

        box-shadow: none;

        page-break-after: always;
        break-after: page;
    }

    .label:last-child {
        page-break-after: auto;
        break-after: auto;
    }
}


/*
    Tell browser to use Letter Landscape.
*/

@page {
    size: Letter landscape;
    margin: 0;
}

</style>
</head>


<body>


<!-- =========================
     CONTROLS
========================= -->

<div class="controls">

    <h1>Pallet ID Generator</h1>

    <div class="instructions">
        Upload your Packing List Excel file.
    </div>

    <div class="file-area">

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >

        <br>

        <button onclick="generateLabels()">
            Generate Labels
        </button>

        <button
            class="print-button"
            onclick="printLabels()"
        >
            Print / Save PDF
        </button>

        <div id="status"></div>

    </div>

</div>


<!-- =========================
     LABEL PREVIEW
========================= -->

<div id="preview"></div>


<script>


/*
=========================================================
UTILITY
=========================================================
*/


function normalizeHeader(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[_\-]/g, " ")
        .replace(/\s+/g, " ");

}


/*
=========================================================
FIND COLUMN
=========================================================
*/

function findColumn(headers, possibleNames) {

    for (const header of headers) {

        const normalizedHeader =
            normalizeHeader(header);

        for (const possibleName of possibleNames) {

            if (
                normalizedHeader ===
                normalizeHeader(possibleName)
            ) {

                return header;

            }

        }

    }

    return null;

}


/*
=========================================================
ESCAPE HTML
=========================================================
*/

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
=========================================================
GENERATE LABELS
=========================================================
*/

async function generateLabels() {

    const fileInput =
        document.getElementById("excelFile");

    const status =
        document.getElementById("status");

    const preview =
        document.getElementById("preview");


    /*
        Check file
    */

    if (!fileInput.files.length) {

        alert(
            "Please select your Packing List Excel file."
        );

        return;

    }


    const file =
        fileInput.files[0];


    status.textContent =
        "Reading Excel file...";


    preview.innerHTML = "";


    try {


        /*
        =================================================
        READ FILE
        =================================================
        */

        const arrayBuffer =
            await file.arrayBuffer();


        /*
            cellStyles:true helps preserve
            Excel formatted values where possible.
        */

        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array",
                    cellStyles: true
                }
            );


        /*
        =================================================
        FIRST SHEET
        =================================================
        */

        const sheetName =
            workbook.SheetNames[0];

        const worksheet =
            workbook.Sheets[sheetName];


        if (!worksheet) {

            throw new Error(
                "No worksheet found."
            );

        }


        /*
        =================================================
        READ AS ARRAY FIRST
        =================================================

        This allows us to identify the header row.
        */

        const rawData =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: ""
                }
            );


        if (
            !rawData ||
            rawData.length === 0
        ) {

            throw new Error(
                "The Excel sheet appears to be empty."
            );

        }


        /*
        =================================================
        FIND HEADER ROW
        =================================================

        Looks for a row containing:
        Item Code / Pallet / Qty
        */

        let headerRowIndex = -1;


        for (
            let i = 0;
            i < Math.min(rawData.length, 20);
            i++
        ) {

            const row =
                rawData[i]
                .map(normalizeHeader);


            const hasItem =
                row.some(x =>
                    [
                        "item code",
                        "itemcode",
                        "item",
                        "sku",
                        "product code"
                    ].includes(x)
                );


            const hasPallet =
                row.some(x =>
                    [
                        "pallet number",
                        "palletnumber",
                        "pallet",
                        "pallet no",
                        "pallet #",
                        "pallet id",
                        "pallet no."
                    ].includes(x)
                );


            const hasQty =
                row.some(x =>
                    [
                        "qty",
                        "quantity",
                        "qty."
                    ].includes(x)
                );


            if (
                hasItem &&
                hasPallet &&
                hasQty
            ) {

                headerRowIndex = i;

                break;

            }

        }


        /*
        =================================================
        IF HEADER NOT FOUND
        =================================================
        */

        if (headerRowIndex === -1) {

            throw new Error(
                "Could not find the Item Code, Pallet Number and Qty columns."
            );

        }


        /*
        =================================================
        CONVERT DATA
        =================================================
        */

        const headers =
            rawData[headerRowIndex];


        const dataRows =
            rawData.slice(
                headerRowIndex + 1
            );


        /*
        Create objects manually.
        */

        const rows =
            dataRows
                .filter(row =>
                    row.some(cell =>
                        String(cell).trim() !== ""
                    )
                )
                .map(row => {

                    const obj = {};

                    headers.forEach(
                        (header, index) => {

                            obj[header] =
                                row[index] ?? "";

                        }
                    );

                    return obj;

                });


        /*
        =================================================
        FIND REQUIRED COLUMNS
        =================================================
        */

        const itemColumn =
            findColumn(
                headers,
                [
                    "Item Code",
                    "ItemCode",
                    "Item",
                    "SKU",
                    "Product Code"
                ]
            );


        const palletColumn =
            findColumn(
                headers,
                [
                    "Pallet Number",
                    "PalletNumber",
                    "Pallet",
                    "Pallet No",
                    "Pallet No.",
                    "Pallet #",
                    "Pallet ID"
                ]
            );


        const qtyColumn =
            findColumn(
                headers,
                [
                    "Qty",
                    "Quantity",
                    "QTY."
                ]
            );


        if (!itemColumn) {

            throw new Error(
                "Item Code column not found."
            );

        }


        if (!palletColumn) {

            throw new Error(
                "Pallet Number column not found."
            );

        }


        if (!qtyColumn) {

            throw new Error(
                "Qty / Quantity column not found."
            );

        }


        /*
        =================================================
        GENERATE LABELS
        =================================================
        */

        let generated = 0;


        rows.forEach(row => {


            const itemCode =
                String(
                    row[itemColumn] ?? ""
                ).trim();


            const palletNumber =
                String(
                    row[palletColumn] ?? ""
                ).trim();


            const qty =
                String(
                    row[qtyColumn] ?? ""
                ).trim();


            /*
                Ignore completely empty rows.
            */

            if (
                !itemCode &&
                !palletNumber &&
                !qty
            ) {

                return;

            }


            /*
            =================================================
            LABEL
            =================================================
            */

            const label =
                document.createElement("div");

            label.className = "label";


            /*
            ITEM CODE
            */

            const item =
                document.createElement("div");

            item.className =
                "item-code";

            item.textContent =
                itemCode;


            /*
            PALLET NUMBER
            */

            const palletArea =
                document.createElement("div");

            palletArea.className =
                "pallet-area";


            const pallet =
                document.createElement("div");

            pallet.className =
                "pallet-number";

            pallet.textContent =
                palletNumber;


            palletArea.appendChild(
                pallet
            );


            /*
            BOTTOM INFO
            */

            const bottom =
                document.createElement("div");

            bottom.className =
                "bottom-info";


            const lot =
                document.createElement("div");

            lot.className =
                "lot-number";

            lot.innerHTML =
                `
                <span>Lot Number:</span>
                <span class="lot-line"></span>
                `;


            const quantity =
                document.createElement("div");

            quantity.className =
                "qty";

            quantity.textContent =
                "Qty: " + qty;


            bottom.appendChild(lot);

            bottom.appendChild(quantity);


            /*
            Assemble
            */

            label.appendChild(item);

            label.appendChild(
                palletArea
            );

            label.appendChild(bottom);


            preview.appendChild(label);


            generated++;

        });


        /*
        =================================================
        RESULT
        =================================================
        */

        if (generated === 0) {

            throw new Error(
                "No pallet data was found."
            );

        }


        status.textContent =
            generated +
            " pallet label(s) generated successfully.";


        /*
        Scroll to preview
        */

        preview.scrollIntoView({
            behavior: "smooth"
        });


    }
    catch (error) {

        console.error(error);

        status.textContent = "";

        alert(
            "Error:\n\n" +
            error.message
        );

    }

}


/*
=========================================================
PRINT
=========================================================
*/

function printLabels() {

    const preview =
        document.getElementById("preview");


    if (
        !preview.children.length
    ) {

        alert(
            "Please generate labels first."
        );

        return;

    }


    window.print();

}


</script>

</body>
</html>
